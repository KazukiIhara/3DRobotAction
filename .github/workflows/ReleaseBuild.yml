name: ReleaseBuild

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]  # 例: v1.0.0 などのタグで起動

env:
  PLATFORM: x64
  CONFIGURATION: Release
  PREMAKE_DIR: Project/Tools/Premake
  PREMAKE_LUA: Project/Tools/Premake/premake5.lua

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate VS solutions with Premake (bundled exe)
        shell: pwsh
        run: |
          $exe = Join-Path $env:PREMAKE_DIR 'premake5.exe'
          if (-not (Test-Path $exe)) { throw "premake5.exe not found at $exe" }
          & $exe --version
          & $exe --file=$env:PREMAKE_LUA vs2022

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build solutions (auto-discover)
        shell: pwsh
        run: |
          $solutions = Get-ChildItem -Path . -Recurse -Filter *.sln
          if ($solutions.Count -eq 0) { throw "No .sln files found after premake generation." }
          foreach ($s in $solutions) {
            Write-Host "Building: $($s.FullName)"
            msbuild $s.FullName /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM /m
          }

      - name: Upload artifact (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.CONFIGURATION }}-bins
          path: |
            **/x64/${{ env.CONFIGURATION }}/*.exe
            **/x64/${{ env.CONFIGURATION }}/*.dll
          if-no-files-found: ignore
