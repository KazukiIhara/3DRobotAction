name: DevelopBuild

on:
  push:
    branches: [ master ]

env:
  CONFIGURATION: Develop
  PLATFORM: x64
  # Premake 入力
  PREMAKE_DIR: Project/Tools/Premake
  PREMAKE_LUA: Project/Tools/Premake/premake5.lua
  # Premake 出力で生成される .sln のパス
  SOLUTION_FILE_PATH: Project/3DRobotAction.sln

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) リポジトリ同梱の premake5.exe を実行して .sln/.vcxproj を生成
      - name: Generate VS solutions with Premake (repo-bundled exe)
        shell: pwsh
        run: |
          $exe = Join-Path $env:PREMAKE_DIR 'premake5.exe'
          if (-not (Test-Path $exe)) { throw "premake5.exe not found at $exe" }
          & $exe --version
          & $exe --file=$env:PREMAKE_LUA vs2022

      # 2) MSBuild セットアップ
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # 3-A) 出力場所が固定なら .sln を直接ビルド
      - name: Build (fixed solution path)
        shell: pwsh
        run: |
          if (-not (Test-Path $env:SOLUTION_FILE_PATH)) {
            throw "Solution not found: $env:SOLUTION_FILE_PATH  (Check Premake 'location' or update SOLUTION_FILE_PATH)"
          }
          msbuild $env:SOLUTION_FILE_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM /m
